<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>
        <p class="subtitle">Manage Student Records</p>

        <!-- Student Form -->
        <div class="form-box">

            <h2>Add / Update Student</h2>

            <form id="studentForm">

                <input type="hidden" id="studentId">

                <label>Student Name</label>
                <input type="text" id="name" placeholder="Enter student name">

                <label>Register Number</label>
                <input type="text" id="regno" placeholder="Enter register number">

                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email">

                <label>Department</label>
                <select id="department">
                    <option value="">Select Department</option>
                    <option value="CSE">CSE</option>
                    <option value="AIML">AIML</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="MECH">MECH</option>
                </select>

                <label>Year</label>
                <select id="year">
                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>

                <button type="submit" id="submitBtn">Add Student</button>
                <button type="button" id="cancelBtn" onclick="cancelEdit()">
                    Cancel
                </button>

            </form>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="Search by name or register number..."
                onkeyup="displayStudents()"
            >
        </div>

        <!-- Student Table -->
        <div class="table-box">

            <h2>Student Records</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Register No</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                </tbody>

            </table>

            <p id="noData">No student records found.</p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
